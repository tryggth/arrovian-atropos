<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090d16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Arrovian Atropos" />
    <meta
      name="description"
      content="Arrovian Atropos PWA — Unifying Burke & Teng's PSPACE-complete Sperner game Atropos with Arrow's Impossibility Theorem."
    />
    <title>Arrovian Atropos — Hidden Dictator Game (v0.2.0)</title>
  </head>
  <body class="bg-[#090d16] text-slate-100 antialiased selection:bg-indigo-500/30 selection:text-indigo-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Offline Service Worker & Auto-Invalidation Handler -->
    <script>
      if ('serviceWorker' in navigator) {
        let refreshing = false;

        // Auto-reload app when a new Service Worker takes control
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            console.log('[PWA Update] New version activated! Reloading app...');
            window.location.reload();
          }
        });
      }
    </script>
  </body>
</html>
